# Capture only: reuse the same Android binary already verified for these app changes.
name: Capture shared anatomy screens
on:
  push:
    branches: ['verify/anatomy-workout-prep']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repacked-ui-apk
          run-id: '44696841053'
          github-token: ${{ github.token }}
          path: android/app/build/outputs/apk/release/
      - uses: actions/download-artifact@v4
        with:
          name: repack-observer
          run-id: '44696841053'
          github-token: ${{ github.token }}
          path: tools/ui-probe/build/outputs/apk/debug/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          disk-size: 2048M
          emulator-boot-timeout: 180
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: FORM_UI_PROBE=1 python3 scripts/runtime-journeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-anatomy-ui-captures
          path: runtime-evidence/
