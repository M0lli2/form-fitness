# Save verified Android runtime screenshots to the review branch.
name: Attach shared anatomy review captures
on:
  push:
    branches: ['verify/anatomy-workout-prep']
permissions:
  actions: read
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anatomy-workout-prep
      - uses: actions/download-artifact@v4
        with:
          name: shared-anatomy-ui-captures
          run-id: '44697713042'
          github-token: ${{ github.token }}
          path: evidence
      - name: Add the capture files and README links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          pairs = {
              "21-anatomy-front.png": "catalog-anatomy-front.png",
              "21-anatomy-back.png": "catalog-anatomy-back.png",
              "30-muscle-heatmap.png": "weekly-anatomy-front.png",
              "30-muscle-heatmap-back.png": "weekly-anatomy-back.png",
          }
          for source, target in pairs.items():
              image = Path("evidence", source)
              assert image.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
              shutil.copyfile(image, Path("docs/screenshots", target))
          readme = Path("README.md")
          text = readme.read_text()
          marker = "## 버전별 변경사항"
          assert text.count(marker) == 1
          rows = '''| 운동도감 앞면 | 운동도감 배면 | 근육 볼륨 앞면 | 근육 볼륨 배면 |
          |---|---|---|---|
          | <img src="docs/screenshots/catalog-anatomy-front.png" width="195" alt="운동도감 인체 모델 앞면"> | <img src="docs/screenshots/catalog-anatomy-back.png" width="195" alt="운동도감 인체 모델 배면"> | <img src="docs/screenshots/weekly-anatomy-front.png" width="195" alt="최근 7일 근육 볼륨 앞면"> | <img src="docs/screenshots/weekly-anatomy-back.png" width="195" alt="최근 7일 근육 볼륨 배면"> |

          [Android 캡처 기록](https://github.com/M0lli2/form-fitness/actions/runs/44697713042)

          '''
          assert "catalog-anatomy-front.png" not in text
          readme.write_text(text.replace(marker, rows.replace("\n          ", "\n") + marker))
          PY
          git diff --check
          git add README.md docs/screenshots/catalog-anatomy-{front,back}.png docs/screenshots/weekly-anatomy-{front,back}.png
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Document the catalog and weekly volume anatomy with Android captures'
          git push origin HEAD:feature/anatomy-workout-prep
