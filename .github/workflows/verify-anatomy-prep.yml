# Internal regression only; reject native/config changes relative to the base binary.
name: Verify compact workout editor on the native anatomy APK
on:
  push:
    branches: ['verify/anatomy-workout-prep']
permissions:
  contents: read
  actions: read
env:
  BASE_ANDROID_TAG: a56920560fccb829e200de56f4de7b974ceeaee3
  BASE_ANDROID_APK: app-release.apk
  BASE_BUILD_RUN: '44692359536'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --exit-code "$BASE_ANDROID_TAG" HEAD -- package.json package-lock.json app.json modules plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: form-offline-release
          run-id: ${{ env.BASE_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: base-apk/
      - run: npm ci --ignore-scripts
      - run: npx expo prebuild --platform android --no-install
      - name: Repack JavaScript for internal regression
        run: |
          mkdir -p repack-evidence repack-out
          npm view @expo/repack-app version > repack-evidence/tool-version.txt
          VERSION=$(cat repack-evidence/tool-version.txt)
          npx --yes "@expo/repack-app@$VERSION" --platform android --source-app "base-apk/$BASE_ANDROID_APK" --output repack-out/app-release.apk --js-bundle-only --embed-bundle-assets --ks android/app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --ks-key-pass pass:android
          printf 'Base native commit: %s (%s)\n' "$(git rev-list -1 "$BASE_ANDROID_TAG")" "$BASE_ANDROID_TAG" > repack-evidence/provenance.txt
          git rev-parse HEAD >> repack-evidence/provenance.txt
      - uses: actions/download-artifact@v4
        with:
          name: android-release-observer
          run-id: ${{ env.BASE_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: tools/ui-probe/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: repacked-ui-apk
          path: repack-out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: repack-observer
          path: tools/ui-probe/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repack-provenance
          path: repack-evidence/
  journeys:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repacked-ui-apk
          path: android/app/build/outputs/apk/release/
      - uses: actions/download-artifact@v4
        with:
          name: repack-observer
          path: tools/ui-probe/build/outputs/apk/debug/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          disk-size: 2048M
          emulator-boot-timeout: 180
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: FORM_UI_PROBE=1 python3 scripts/runtime-journeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repacked-ui-journey-evidence
          path: runtime-evidence/
