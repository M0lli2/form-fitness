# 서명 없는 빌드 확인용. 스토어 업로드/개발자 인증서는 별도로 관리합니다.
name: Native build validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'modules/**'
      - 'watchos/**'
      - 'wearos/**'
      - 'plugins/**'
      - 'app.json'
      - 'package*.json'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: form-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  wearos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p wearos assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: form-wearos-debug
          path: wearos/app/build/outputs/apk/debug/*.apk
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo prebuild --platform ios
      - run: xcodebuild -workspace ios/FORM.xcworkspace -scheme FORM -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - run: brew install xcodegen
      - run: cd watchos && xcodegen generate && xcodebuild -project FORMWatch.xcodeproj -scheme FORMWatch -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build
