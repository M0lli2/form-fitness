# 커밋마다 도메인 테스트와 실제 의존성을 사용한 타입 검사를 수행합니다.
name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: python3 -m py_compile scripts/runtime-smoke.py scripts/runtime-journeys.py
      - run: npm test
      - run: npm run check
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir /tmp/form-bundle
