# 커밋마다 도메인 테스트와 실제 의존성을 사용한 타입 검사를 수행합니다.
name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - run: npm ci --ignore-scripts
      - name: Save resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - name: Collect dependency vulnerability report
        continue-on-error: true
        run: npm audit --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
      - run: python3 -m py_compile scripts/runtime-smoke.py scripts/runtime-journeys.py
      - run: python3 scripts/check-apk-pair.py --self-test
      - run: npm test
      - run: npm run check
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir /tmp/form-bundle --source-maps
      - run: node scripts/report-runtime-dependencies.mjs /tmp/form-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-security-evidence
          path: bundle-security-report.json
