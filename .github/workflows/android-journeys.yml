# Run longer UI journeys against the exact APK produced by a completed release smoke run.
name: Android saved-data journeys
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Successful Android runtime run containing the release APK
        required: true
        default: '44076887909'
  workflow_run:
    workflows: ['Android runtime smoke']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  journeys:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: form-offline-release
          run-id: ${{ github.event.workflow_run.id || inputs.apk_run_id || '44076887909' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android/app/build/outputs/apk/release/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p tools/ui-probe assembleDebug
      - name: Record APK source and test source separately
        run: |
          mkdir -p runtime-evidence
          echo 'APK commit: ${{ github.event.workflow_run.head_sha }}' > runtime-evidence/provenance.txt
          git rev-parse HEAD >> runtime-evidence/provenance.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          disk-size: 2048M
          emulator-boot-timeout: 180
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: FORM_UI_PROBE=1 python3 scripts/runtime-journeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-journey-evidence
          path: runtime-evidence/
