# Run longer UI journeys against the exact APK produced by a completed release smoke run.
name: Android saved-data journeys
on:
  workflow_run:
    workflows: ['Android runtime smoke']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  journeys:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: form-offline-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android/app/build/outputs/apk/release/
      - name: Record APK source and test source separately
        run: |
          mkdir -p runtime-evidence
          echo 'APK commit: ${{ github.event.workflow_run.head_sha }}' > runtime-evidence/provenance.txt
          git rev-parse HEAD >> runtime-evidence/provenance.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/runtime-journeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-journey-evidence
          path: runtime-evidence/
