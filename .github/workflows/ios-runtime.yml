# Simulator installation/launch evidence; HealthKit/watch pairing requires physical devices.
name: iOS runtime smoke
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ios-runtime.yml', 'scripts/configure-ios-tests.rb', 'tests/ios/**']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo prebuild --platform ios
      - run: EAS_BUILD_PLATFORM=ios npm run eas-build-post-install
      - run: ruby scripts/configure-ios-tests.rb
      # Release configuration embeds JS, so no Metro server is needed for launch.
      - run: xcodebuild -workspace ios/FORM.xcworkspace -scheme FORM -destination 'generic/platform=iOS Simulator' -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - name: Boot, install and launch
        run: |
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, subprocess, time, pathlib
          def run(*args):
              return subprocess.check_output(args, stderr=subprocess.STDOUT)
          devices = json.loads(run('xcrun','simctl','list','devices','available','--json'))['devices']
          phone = next(d for group in devices.values() for d in group if d['name'].startswith('iPhone'))
          udid = phone['udid']
          if phone['state'] != 'Booted':
              run('xcrun','simctl','boot',udid)
          run('xcrun','simctl','bootstatus',udid,'-b')
          app = 'build/Build/Products/Release-iphonesimulator/FORM.app'
          run('xcrun','simctl','install',udid,app)
          first = run('xcrun','simctl','launch',udid,'com.mori.form').decode()
          time.sleep(15)
          run('xcrun','simctl','io',udid,'screenshot','runtime-evidence/ios-home.png')
          # OCR makes a rendered error screen fail even when the app process survives.
          pathlib.Path('runtime-evidence/assert-home.swift').write_text("""
          import Foundation
          import Vision
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.recognitionLanguages = ["ko-KR", "en-US"]
          try VNImageRequestHandler(url: url).perform([request])
          let text = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: "\\n")
          print(text)
          guard text.contains("오늘"), !text.contains("entitlement"), !text.contains("failed") else { exit(1) }
          """)
          run('swift','runtime-evidence/assert-home.swift','runtime-evidence/ios-home.png')
          # A second launch after termination verifies that startup is repeatable.
          run('xcrun','simctl','terminate',udid,'com.mori.form')
          second = run('xcrun','simctl','launch',udid,'com.mori.form').decode()
          time.sleep(10)
          run('xcrun','simctl','io',udid,'screenshot','runtime-evidence/ios-relaunch.png')
          run('swift','runtime-evidence/assert-home.swift','runtime-evidence/ios-relaunch.png')
          run('xcrun','simctl','terminate',udid,'com.mori.form')
          pathlib.Path('runtime-evidence/launch.txt').write_text(first + second)
          PY
      - name: Exercise native navigation and persisted preferences
        run: |
          PHONE=$(xcrun simctl list devices booted --json | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -workspace ios/FORM.xcworkspace -scheme FORMUITests -destination "platform=iOS Simulator,id=$PHONE" -configuration Release -derivedDataPath build -resultBundlePath runtime-evidence/ui-tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-runtime-evidence
          path: runtime-evidence/
