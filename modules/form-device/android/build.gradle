apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.mori.form.device'
version = '0.1.0'
// Expo's module plugin reads these values while configuring the local module.
android { namespace 'com.mori.form.device'; defaultConfig { minSdkVersion 28; versionCode 1; versionName '0.1.0' } }
dependencies {
  implementation 'androidx.health.connect:connect-client:1.1.0'
  implementation 'androidx.activity:activity-ktx:1.10.1'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
}
