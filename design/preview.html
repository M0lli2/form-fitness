<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORM · Design review 01</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:#25372e}button{font:inherit;cursor:pointer}header{max-width:1230px;margin:auto;padding:34px 32px 24px;border-bottom:1px solid #dadfd7;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;letter-spacing:-1px;margin:0 0 9px}.kicker{font-size:10px;letter-spacing:2px;color:#6d806e;margin-bottom:12px}.intro{font-size:12px;color:#748071;line-height:1.7;margin:0}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.control{border:1px solid #d0d9cc;padding:10px 15px;border-radius:30px;color:#52654f;background:transparent;font-size:12px}.control.active{background:#2f4d3d;color:white;border-color:#2f4d3d}.board{max-width:1200px;margin:30px auto;display:flex;justify-content:center;gap:70px;padding:0 24px}.variant{width:360px}.variant-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;margin-bottom:14px;color:#788774}.phone{--bg:#f3f5f0;--ink:#253d30;--muted:#6c7c6d;--card:#fff;--border:#dfe5da;--soft:#e9eee2;--lime:#dbefb8;width:360px;height:740px;border:7px solid #e1e4dd;border-radius:43px;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 24px 60px #253f2410;color:var(--ink)}.phone.dark{--bg:#131c17;--ink:#edf3e9;--muted:#9aaf9c;--card:#1c2920;--border:#324333;--soft:#2c3e2c;--lime:#d4edac;border-color:#303a31}.glass .phone{background:radial-gradient(ellipse at 90% 0,#bdcdb7 0,transparent 45%),radial-gradient(ellipse at 0% 70%,#dce9cc 0,transparent 50%),#eef3ed}.glass .phone.dark{background:radial-gradient(ellipse at 90% 0,#344e38 0,transparent 45%),radial-gradient(ellipse at 0% 70%,#263b28 0,transparent 50%),#101b14}.glass .card{background:#ffffff70;backdrop-filter:blur(22px);border-color:#fff9;box-shadow:inset 0 1px 0 #fff8,0 6px 20px #28452405}.glass .dark .card{background:#30453266;border-color:#70826c60;box-shadow:inset 0 1px 0 #9ab29320}.status{height:38px;display:flex;justify-content:space-between;align-items:center;padding:9px 22px 0;font-size:11px;font-weight:600}.island{position:absolute;width:90px;height:22px;border-radius:15px;background:#18231b;left:50%;top:8px;transform:translateX(-50%)}.screen{height:calc(100% - 112px);overflow:auto;padding:15px 20px 20px;scrollbar-width:none}.brandrow{display:flex;justify-content:space-between;align-items:center;margin:2px 0 26px}.brand{font-size:29px;font-weight:700;letter-spacing:-2px}.brand span{color:#91ac75}.avatar{width:29px;height:29px;background:var(--soft);border-radius:50%;display:grid;place-items:center;font-size:10px}.hello{font-size:10px;color:var(--muted);margin-bottom:8px}h2{font-size:25px;font-weight:600;letter-spacing:-1.2px;margin:0 0 20px;line-height:1.4}.card{border:1px solid var(--border);background:var(--card);border-radius:21px;padding:18px;margin-bottom:13px;transition:background .25s}.hero{padding:23px 20px}.micro{font-size:9px;color:var(--muted);letter-spacing:1.5px}.hero h3{font-size:22px;letter-spacing:-1px;margin:18px 0 10px;line-height:1.45;font-weight:600}.desc{font-size:11px;color:var(--muted);line-height:1.8;margin:0}.primary{border:0;background:var(--lime);color:#2d482d;border-radius:12px;padding:14px;width:100%;font-size:11px;font-weight:600;margin-top:20px;display:flex;justify-content:space-between}.metrics{display:flex;gap:9px;margin:17px 0 22px}.metric{flex:1;padding:15px 10px;border:0;background:var(--soft);border-radius:14px}.metric small{font-size:9px;color:var(--muted)}.metric b{font-size:23px;font-weight:500;display:block;margin-top:9px}.metric b span{font-size:10px;color:var(--muted);font-weight:400}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px}.section h4{font-size:13px;font-weight:600;margin:0}.section span{font-size:9px;color:var(--muted)}.routine{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.routine:last-child{border:0}.icon{width:34px;height:34px;background:var(--soft);border-radius:11px;display:grid;place-items:center;font-size:17px}.routine .name{font-size:11px;font-weight:600;margin-bottom:5px}.routine .meta{font-size:9px;color:var(--muted)}.arrow{margin-left:auto;color:var(--muted)}.nav{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-around;padding:12px 3px 9px;border-top:1px solid var(--border);background:var(--bg);border-radius:0 0 24px 24px}.glass .nav{border:1px solid #ffffff70;background:#ffffff99;backdrop-filter:blur(22px);border-radius:23px}.glass .dark .nav{background:#34493399;border-color:#7d957540}.nav button{border:0;color:var(--muted);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:8px;min-width:40px}.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}.nav button.sel{color:var(--ink);font-weight:bold}.timer{display:flex;justify-content:space-between;align-items:center;font-size:11px;background:var(--soft);padding:13px;border-radius:11px;margin-bottom:18px}.timer b{font-variant-numeric:tabular-nums;font-size:18px;font-weight:500}.sethead,.set{display:grid;grid-template-columns:25px 1fr 1fr 36px;gap:7px;align-items:center;text-align:center;margin-top:9px}.sethead{font-size:8px;color:var(--muted);margin-top:17px}.set{font-size:11px}.set input{width:100%;text-align:center;background:var(--soft);border:0;border-radius:9px;padding:11px 3px;color:var(--ink);font:inherit}.check{padding:9px;background:var(--lime);border-radius:9px;color:#2d482d}.check.empty{background:var(--soft);color:var(--muted)}.subbutton{width:100%;background:transparent;border:1px solid var(--border);border-radius:10px;padding:11px;margin-top:13px;color:var(--muted);font-size:10px}.worktitle{display:flex;justify-content:space-between;font-size:12px;font-weight:600}.worktitle small{font-size:9px;color:var(--muted);font-weight:400}.previous{font-size:9px;margin-top:9px;color:var(--muted)}.bodymetrics{display:flex;justify-content:space-between;margin:23px 0 8px}.bodymetrics small{font-size:9px;color:var(--muted)}.bodymetrics b{display:block;font-size:26px;margin:10px 0;font-weight:500}.bodymetrics span{font-size:9px;color:var(--muted)}svg.chart{width:100%;height:100px;margin-top:18px}.chart path{fill:none;stroke:#8ba868;stroke-width:2}.chart circle{fill:#8ba868}.dates{display:flex;justify-content:space-between;font-size:8px;color:var(--muted)}.hint{max-width:800px;margin:30px auto 40px;padding:0 24px;color:#74806c;font-size:11px;line-height:1.8;text-align:center}.toggle{width:34px;height:20px;background:#9ebc7c;border-radius:20px;display:flex;align-items:center;padding:3px}.toggle:after{content:'';width:14px;height:14px;border-radius:50%;background:white;margin-left:auto}.off .toggle{background:#a2aa9c}.off .toggle:after{margin-left:0}.samples{display:flex;align-items:center;gap:7px}.sample-dot{width:5px;height:5px;border-radius:50%;background:#a5b28f}@media(max-width:800px){.board{gap:22px;flex-wrap:wrap}header{flex-direction:column;align-items:flex-start}.phone{width:340px}.variant{width:340px}.controls{gap:5px}.control{font-size:11px;padding:10px 12px}}
</style></head><body><header><div><div class="kicker">FORM / DESIGN REVIEW 01</div><h1>덜어낼수록, 운동에 집중.</h1><p class="intro">라이트 · 다크 / Liquid Glass ON · OFF 비교 시안<br>디자인 검토용 화면입니다. 아래 수치는 샘플이며 실제 앱 기록이 아닙니다.</p></div><div><div class="controls" id="screens"><button class="control active" data-screen="home">홈</button><button class="control" data-screen="workout">운동 기록</button><button class="control" data-screen="body">인바디</button></div><div class="controls" style="margin-top:10px"><button class="control off" id="glass" style="display:flex;gap:10px;align-items:center">Liquid Glass <span class="toggle"></span><b>OFF</b></button></div></div></header><div class="board" id="board"></div><p class="hint">검토 포인트: 전체 분위기 · 글자 크기 · 색상 · 카드 밀도 · 유리 효과 강도<br>이 시안은 네이티브 앱의 시각 기준입니다. OS별 Liquid Glass 렌더링은 실제 기기에서 차이가 있습니다.</p><script>
// 상태 전환만 있는 디자인 검토 도구. 네이티브 앱과 분리된 문서이며 실제 건강 데이터는 없습니다.
const icons=['<path d="M3 10 12 3l9 7v11h-7v-7h-4v7H3z"/>','<path d="M5 7v10M2 9v6M19 7v10M22 9v6M5 12h14"/>','<path d="M4 4h16v17H4zM8 8h8M8 12h8M8 16h5"/>','<path d="m3 18 6-6 4 3 8-11M16 4h5v5"/>','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'];
let screen='home',glass=false;
const home=()=>`<div class="hello">11월 16일 월요일 · 좋은 하루예요</div><h2>오늘도,<br>나의 페이스로.</h2><div class="card hero"><div class="micro">YOUR NEXT SESSION</div><h3>작은 기록이 만드는<br>단단한 변화.</h3><p class="desc">준비된 루틴으로 가볍게 시작해 보세요.</p><button class="primary" onclick="select('workout')">운동 시작하기 <span>↗</span></button></div><div class="metrics"><div class="metric"><small>이번 주 운동</small><b>3 <span>회</span></b></div><div class="metric"><small>운동 시간</small><b>148 <span>분</span></b></div><div class="metric"><small>주간 목표</small><b>3<span> / 4</span></b></div></div><div class="section"><h4>나의 루틴</h4><span>전체 보기 ↗</span></div><div class="routine"><div class="icon">▥</div><div><div class="name">상체에 집중하는 날</div><div class="meta">가슴 · 등 · 어깨 &nbsp; 6개 운동</div></div><span class="arrow">›</span></div><div class="routine"><div class="icon">⌁</div><div><div class="name">단단한 하체의 시작</div><div class="meta">하체 · 둔근 · 코어 &nbsp; 6개 운동</div></div><span class="arrow">›</span></div>`;
const workout=()=>`<div class="hello">LIVE WORKOUT · 24:36</div><h2>상체에 집중하는 날</h2><div class="timer"><span>다음 세트까지 휴식</span><b>01:24</b><span>건너뛰기 ›</span></div><div class="card"><div class="worktitle">바벨 벤치 프레스 <small>자세 보기 ↗</small></div><div class="previous">이전 기록 &nbsp; 50 kg × 10회 · 3세트</div><div class="sethead"><span>세트</span><span>kg</span><span>횟수</span><span>완료</span></div>${[1,2,3].map(i=>`<div class="set"><span>${i}</span><input aria-label="${i}세트 중량" value="50"><input aria-label="${i}세트 횟수" value="10"><span class="check ${i===3?'empty':''}">${i===3?'○':'✓'}</span></div>`).join('')}<button class="subbutton">+ 세트 추가</button></div><div class="card"><div class="worktitle">시티드 케이블 로우 <small>자세 보기 ↗</small></div><div class="previous">이전 기록 &nbsp; 40 kg × 12회</div><div class="sethead"><span>세트</span><span>kg</span><span>횟수</span><span>완료</span></div><div class="set"><span>1</span><input aria-label="로우 중량" value="40"><input aria-label="로우 횟수" value="12"><span class="check empty">○</span></div><button class="subbutton">+ 세트 추가</button></div><button class="primary">운동 마치고 저장 <span>✓</span></button>`;
const body=()=>`<div class="hello">BODY COMPOSITION</div><h2>숫자로 만나는 변화.</h2><div class="card"><div class="micro">LATEST CHECK-IN · 11.16</div><div class="bodymetrics"><div><small>체중</small><b>72.4</b><span>kg &nbsp; −0.8</span></div><div><small>골격근량</small><b>34.2</b><span>kg &nbsp; +0.3</span></div><div><small>체지방률</small><b>18.6</b><span>% &nbsp; −0.5</span></div></div></div><div class="card"><div class="worktitle">체중의 흐름 <small>최근 6회</small></div><svg class="chart" viewBox="0 0 260 95"><path opacity=".2" d="M0 20H260M0 50H260M0 80H260"/><path d="M5 19 55 31 105 26 155 51 205 61 255 75"/>${[[5,19],[55,31],[105,26],[155,51],[205,61],[255,75]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3"/>`).join('')}</svg><div class="dates"><span>10.12</span><span>10.26</span><span>11.09</span><span>11.16</span></div></div><button class="primary">+ 인바디 기록 등록 <span>↗</span></button><div class="section"><h4>측정 기록</h4><span>전체 보기 ↗</span></div><div class="routine"><div class="icon">▤</div><div><div class="name">2026. 11. 16</div><div class="meta">72.4 kg · 체지방 18.6% · 결과지 첨부</div></div><span class="arrow">›</span></div><p class="desc" style="margin-top:17px">체중 하나보다, 몸의 변화를 함께 봅니다.</p>`;
function select(value){screen=value;render();}function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));document.body.classList.toggle('glass',glass);document.getElementById('board').innerHTML=['light','dark'].map(mode=>`<div class="variant"><div class="variant-label"><span>${mode.toUpperCase()}</span><span class="samples"><i class="sample-dot"></i> GLASS ${glass?'ON':'OFF'}</span></div><div class="phone ${mode}"><div class="island"></div><div class="status"><span>9:41</span><span>▮▮▮ &nbsp; ▰</span></div><div class="screen"><div class="brandrow"><div class="brand">form<span>.</span></div><div class="avatar">M</div></div>${({home,workout,body})[screen]()}</div><div class="nav">${['오늘','운동','운동법','성장','인바디'].map((label,i)=>`<button class="${screen===(['home','workout','','','body'][i])?'sel':''}" onclick="${[0,1,4].includes(i)?`select('${['home','workout','','','body'][i]}')`:''}"><svg viewBox="0 0 24 24">${icons[i]}</svg>${label}</button>`).join('')}</div></div></div>`).join('');}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>select(b.dataset.screen));document.getElementById('glass').onclick=function(){glass=!glass;this.classList.toggle('off',!glass);this.querySelector('b').textContent=glass?'ON':'OFF';render()};render();
</script></body></html>
